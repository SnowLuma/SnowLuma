# Run the root validation commands on every pull request.
name: CI

on:
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when the PR gets new commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all package tests
        run: pnpm test

      # The MCP test suite regenerates the action catalog (catalog.ts + the
      # catalog.json the docs site consumes). Fail if the committed snapshot
      # drifted from the live specs — keeps the API docs from going stale.
      - name: Verify generated action catalog is up to date
        run: |
          catalog_status="$(git status --porcelain=v1 --untracked-files=all -- packages/mcp/src/generated)"
          if [ -n "$catalog_status" ]; then
            git diff -- packages/mcp/src/generated
            printf '%s\n' "$catalog_status"
            echo '::error::Generated action catalog is stale. Run `pnpm --filter @snowluma/mcp gen` and commit packages/mcp/src/generated/.' >&2
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release inputs
        run: pnpm run build:all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint managed source files
        run: pnpm lint
